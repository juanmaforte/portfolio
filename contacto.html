        </div>    
    </header>
    <main>
        <h1>Contactame</h1>
        <h3>¿Tenés alguna pregunta? Escribime un mensaje</h3>
        <section  class="grilla3060">
            <section class="contacto-izq">
                <h2>Información de contacto</h2>
            </section>
            <section class="contacto-der">
                <form method="post" action="mailto:juanma02forte@hotmail.com?subject=Email enviado desde el formulario"
                    target="_blank" enctype="text/plain">
                    <div>
                        <div class="campo">
                            <label for="Nombre">Nombre: </label>
                            <input type="text" name="Nombre" id="Nombre" maxlength="30" placeholder="Ej.: Juan"
                                required>
                        </div>
                        <div class="campo">
                            <label for="Apellido">Apellido: </label>
                            <input type="text" name="Apellido" id="Apellido" maxlength="30" placeholder="Ej.: Gonzalez">
                        </div>
                    </div>
                    <div>
                        <div class="campo">
                            <label for="Email">Email: </label>
                            <input type="email" name="Email" id="Email" maxlength="40" placeholder="Ej.: @gmail"
                                required>
                        </div>
                        <div class="campo">
                            <label for="Telefono">Número de Teléfono: </label>
                            <input type="tel" name="Telefono" id="Telefono" maxlength="30"
                                placeholder="Ej.: 11-1234-5678">
                        </div>
                    </div>
                    <div>
                        <div class="campo">
                            <p>Seleccionar Motivo</p>
                            <div class="radiobutton">
                                <label><input type="radio" name="motivo" value="trabajo" id="trabajo">Propuesta de trabajo</label>
                                <label><input type="radio" name="motivo" value="consulta" id="consulta">Consulta general</label>
                            </div>
                        </div>
                    </div>
                    <div>
                        <div class="campo">
                            <label for="mensaje">Mensaje: </label>
                            <textarea name="mensaje" id="mensaje">Escribí tu mensaje aquí</textarea>
                        </div>
                    </div>
                    <div>
                        <input class="boton" type="reset" value="Borrar Todo">
                        <input class="boton" type="submit" value="Enviar Mensaje">
                    </div>
                </form>
            </section>
        </section>
    </main>
